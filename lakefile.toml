name = "dk_1970_formalization"
version = "0.1.0"
# The ordinary default build is the extracted Davis--Kahan mathematics. Palomar
# Challenge/Solution modules are built explicitly from their Comparator config;
# there is intentionally no aggregate `Palomar.lean` because the two modules
# repeat the same declaration names in separate environments.
defaultTargets = ["DavisKahan", "Challenge", "Solution"]

[leanOptions]
pp.unicode.fun = true
# Avoid accidental free variables in theorem statements.
autoImplicit = false

# Tau Ceti, pinned. `ForTauCeti` below is the reusable-mathematics package whose
# declarations already carry their final `TauCeti.*` namespaces; this dependency is
# the released upstream it is written against.
[[require]]
name = "TauCeti"
git = "https://github.com/TauCetiProject/TauCeti.git"
rev = "1b39d420ac84ed9a5a7d536ce19b37818ad29c39"

# Keep Mathlib last so this workspace owns the pin used by every library here and
# by the Tau Ceti checkout. The revision is the one the extraction was verified at
# and is recorded in `lake-manifest.json`.
[[require]]
name = "mathlib"
scope = "leanprover-community"

# The reusable-mathematics layer. A ForTauCeti module imports only `Mathlib.*`,
# `TauCeti.*` and `ForTauCeti.*`. The option set mirrors the one Tau Ceti applies to
# its own libraries, so a warning here is a warning upstream would see too.
[[lean_lib]]
name = "ForTauCeti"
globs = ["ForTauCeti.*"]
leanOptions = { warningAsError = true, weak.linter.mathlibStandardSet = true, weak.linter.style.longFile = 1500, weak.linter.style.longFileDefValue = 1500, weak.linter.style.header = false }

# The Davis--Kahan development.
[[lean_lib]]
name = "DavisKahan"

# Palomar's ordinary submission surface lives at the repository root, matching
# the official template. `Challenge.lean` is the Mathlib-only statement surface
# and `Solution.lean` supplies the proofs.
[[lean_lib]]
name = "Challenge"
roots = ["Challenge"]

[[lean_lib]]
name = "Solution"
roots = ["Solution"]

# Solution-only support. This module re-elaborates the Challenge vocabulary in a
# Mathlib-only environment so Comparator sees identical helper constants. It is
# deliberately not imported by Challenge.lean.
[[lean_lib]]
name = "Palomar"
globs = ["Palomar.*"]
