version: v0.4

project:
  name: 'Davis-Kahan 1970: the four Section 2 rotation-of-eigenvectors theorem families'
  description: >-
    Machine-checked Lean 4 presentation of the four headline theorem families in
    Section 2 of Davis and Kahan (1970): sin-Theta, tan-Theta, sin-2-Theta, and
    tan-2-Theta. The Palomar Comparator exposes five nonredundant declarations:
    the residual sin-Theta estimate, the residual tan-Theta estimate, both the
    residual and whole-space sin-2-Theta estimates, and the residual tan-2-Theta
    estimate. The statements retain the paper's standing separable Hilbert-space
    scope, allow finite or infinite dimension, and are generic over RCLike scalars
    to cover the real and complex cases. Their norm quantifier is presented in the
    Challenge by a dimension-coherent symmetric norming function; the included
    formalization proves via Fan dominance that the corresponding inequalities
    yield the source-facing universal unitarily invariant norm estimates.
  authors:
    - Jon Crall
    - Edward Wang
  license: Apache-2.0
  responsible_maintainers:
    - Jon Crall

classification:
  arxiv:
    - math.FA
    - math.NA
  msc2020:
    - 47A55
    - 47A15
    - 15A42
    - 65F15

sources:
  - title: The rotation of eigenvectors by a perturbation. III
    authors:
      - Chandler Davis
      - William M. Kahan
    id: doi:10.1137/0707001
    type: paper
    location: >-
      Section 1 standing notation and separability convention; Section 2 four
      unnumbered theorem statements and the unbounded-operator paragraph that
      immediately follows them
    relationship: formalizes
    note: >-
      The compared declarations present the four unnumbered theorem families from
      Section 2 as five nonredundant inequalities. For sin-Theta the Challenge
      compares the printed residual estimate and uses the source-facing
      where-defined norm boundary; the paper explicitly shows that the analogous
      whole-space UIN estimate does not follow from the one-gap hypotheses. For
      tan-Theta the residual estimate is compared; the source proof then derives
      the whole-space estimate from the common two-corner geometry. Both
      sin-2-Theta clauses are compared because they are distinct conclusions. In
      the directed clause, A and the perturbed operator T are self-adjoint on a
      common domain, the trial subspace reduces A, the comparison subspace reduces
      T, the gap is on the two T-blocks (Lambda_0, Lambda_1), and only the residual
      extension is required bounded. In the ambient clause T is A+H for a bounded
      self-adjoint H and the same printed perturbed-block gap is used. For
      tan-2-Theta the residual estimate is compared; the source states that the
      whole-space estimate follows by Lemma 6.1. The Challenge's SylvesterGap also
      includes the half-line variants explicitly authorized by the paragraph after
      the four theorem statements. The Challenge uses a symmetric-norming
      presentation of the norm quantifier. This is not literally the entire
      infinite-dimensional UIN type, but the included development proves the
      relevant quantifier equivalence for these inequalities through Ky Fan/Fan
      dominance and provides source-facing where-defined endpoints.
    author_endorsement: not-contacted

related_formalizations:
  - id: AIQ-Kitware/aiq-dkps-formalization
    relationship: builds-on
    note: >-
      Authoritative development and audit history. The accepted common-domain
      sin-2-Theta source module and the source-facing Section Two inventory used by
      this submission were refreshed from parent commit
      9fe59f6b02482111e5be6a2b812edd011990fda5. The standalone repository commits
      the extracted proof source it builds; it is not a thin Comparator-only
      wrapper.

status:
  scope: >-
    Compared here are five declarations: sinTheta; tanTheta in the stronger
    residual form; sinTwoTheta_directed at the source common-domain scope;
    sinTwoTheta_ambient; and tanTwoTheta in the stronger residual form. The
    Challenge is Mathlib-only and defines the source vocabulary it needs locally.
    The statements are generic over RCLike, retain the paper's standing
    separability convention, and use unbounded partial maps where the source scope
    requires them. The three sine declarations expose the source-facing
    where-defined norm boundary rather than adding ideal-membership transfer to the
    public conclusion. The directed sin-2-Theta declaration does not assume a
    bounded trial compression or a globally bounded perturbation: it assumes only
    a common domain and a bounded residual extension. Whole-space tan-Theta and
    tan-2-Theta endpoints, broader source-facing UIN facades, and the rest of the
    1970 paper are proved in the included DavisKahan library but are not separate
    Comparator declarations in this entry. The entry makes no claim that every
    result of the 1970 paper is selected by Comparator.
  sorry_count: 0
  sorry_in_definitions: 0
  main_results:
    - declaration: RotationOfEigenvectors.sinTheta
      file: Palomar/DKSectionTwo/Solution.lean
      sorry_count: 0
      comparator_config: registry/dk-section-two/comparator.json
    - declaration: RotationOfEigenvectors.tanTheta
      file: Palomar/DKSectionTwo/Solution.lean
      sorry_count: 0
      comparator_config: registry/dk-section-two/comparator.json
    - declaration: RotationOfEigenvectors.sinTwoTheta_directed
      file: Palomar/DKSectionTwo/Solution.lean
      sorry_count: 0
      comparator_config: registry/dk-section-two/comparator.json
    - declaration: RotationOfEigenvectors.sinTwoTheta_ambient
      file: Palomar/DKSectionTwo/Solution.lean
      sorry_count: 0
      comparator_config: registry/dk-section-two/comparator.json
    - declaration: RotationOfEigenvectors.tanTwoTheta
      file: Palomar/DKSectionTwo/Solution.lean
      sorry_count: 0
      comparator_config: registry/dk-section-two/comparator.json

