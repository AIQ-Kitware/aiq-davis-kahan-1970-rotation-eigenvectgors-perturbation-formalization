fidelity:
  divergences: >-
    The Challenge's SymmetricNormingFunction is a canonical presentation of the
    source norm quantifier, not literally the entire class of infinite-dimensional
    unitarily invariant norms as a Lean type. The included development formally
    proves that the estimates quantified over all symmetric norming functions are
    equivalent, via Ky Fan/Fan dominance, to the corresponding source-facing UIN
    estimates. The Challenge uses RCLike to package the paper's real and complex
    cases in one theorem, while retaining the paper's standing separable
    Hilbert-space convention. SylvesterGap is used where the source permits the
    symmetric interval/exterior alternatives (notably sin-Theta). The two
    sin-2-Theta declarations instead use SinTwoThetaGap, which fixes the printed
    orientation Lambda_0-inside/Lambda_1-outside and includes only the lower
    half-line extension explicitly stated after the Section 2 theorems; the
    Solution forgets that orientation only when entering the stronger internal
    Sylvester-gap API. The public statements also do not impose the paper's Section
    1 equalities between the relative dimensions of the compared subspaces. This
    is a genuine formal strengthening/adaptation: Section 8 explicitly extends the
    sin-2-Theta theorem to dim X(E_0) < dim X(F_0), while saying that no
    corresponding tan-2-Theta extension was known. For sin-Theta and both
    sin-2-Theta clauses the
    public Challenge uses the source-facing where-defined boundary: finiteness of
    both displayed norms is assumed and only the numerical inequality is
    concluded, even though stronger implementation theorems can transfer ideal
    membership. directedDoubleSine and ambientDoubleSine are explicit
    projection-block representatives whose complete approximation-number
    sequences agree with the paper's directed and ambient double-angle operators.
    The tangent declarations expose stronger implementation information by also
    concluding pole exclusion and finiteness of the tangent sequence; their
    numerical inequalities are the Section 2 residual bounds. Whole-space
    tan-Theta and tan-2-Theta clauses are not separately selected by Comparator
    because the source derives them after the residual bounds under the common
    theorem setup; their formal endpoints remain in the library. The one-gap
    sin-Theta entry intentionally has no ambient UIN clause, matching the source
    counterexample and subsequent separate symmetric sin-Theta proposition.

review:
  status: self-assessed
  reviewers:
    - Jon Crall
  notes: >-
    No external peer review is claimed. The selected Challenge and Solution modules
    have been kernel-built successfully at the pinned toolchain. The standalone
    repository has a static Palomar readiness checker and a verifier that derives
    the selected Challenge and Solution module targets from comparator.json and,
    when Comparator and NanoDa are installed, runs the real exporter and independent
    kernel check. The theorem selection and informal account were audited against a
    modernized transcription of the original 1970 paper, including its standing
    separability convention, its common-domain unbounded scope, the source's
    counterexample to an ambient one-gap sin-Theta UIN bound, and the distinction
    between the directed and ambient sin-2-Theta clauses. Compiler verification and
    source-semantic fidelity are treated as separate review axes.

alignment:
  namespace: RotationOfEigenvectors
  statements:
    - source: Davis--Kahan 1970, Section 2, sin Theta theorem (residual conclusion)
      lean: RotationOfEigenvectors.sinTheta
      module: Palomar.DKSectionTwo.Solution
      status: adapted
      note: >-
        The Challenge states the printed residual estimate at the paper's standing
        separable Hilbert-space scope, scalar-generic over RCLike. Both displayed
        norms are explicitly assumed finite, matching the accepted source-facing
        where-defined endpoint; no ideal-membership transfer is part of the public
        conclusion. SymmetricNormingFunction is the Challenge's canonical
        symmetric-norming presentation, and the included Fan-dominance development
        bridges it to the source-facing universal UIN formulation. The included
        source-facing alias is TauCeti.DavisKahan1970.SectionTwo.sinTheta.
    - source: Davis--Kahan 1970, Section 2, tan Theta theorem (residual conclusion)
      lean: RotationOfEigenvectors.tanTheta
      module: Palomar.DKSectionTwo.Solution
      status: adapted
      note: >-
        This is the stronger residual/directed conclusion together with tangent
        pole exclusion, at the paper's standing separable scope. Its semibounded
        gap is the half-line form explicitly allowed immediately after the four
        Section 2 statements. The paper subsequently derives its whole-space
        tangent inequality from the common block geometry. The corresponding
        included source API is
        TauCeti.DavisKahan1970.SectionTwo.tanTheta_directed.
    - source: Davis--Kahan 1970, Section 2, sin 2Theta theorem (residual conclusion)
      lean: RotationOfEigenvectors.sinTwoTheta_directed
      module: Palomar.DKSectionTwo.Solution
      status: adapted
      note: >-
        This declaration has the source common-domain shape. A and the perturbed
        operator T are self-adjoint on the same domain; U reduces A, V reduces T;
        SinTwoThetaGap fixes the printed orientation on the two V-blocks of T,
        corresponding to Lambda_0 inside and Lambda_1 outside; and R is only a
        bounded extension of the residual (T-A)|_U on that common domain. There is
        no bounded trial compression and no globally bounded perturbation hypothesis
        in this directed clause. Both displayed norms are assumed finite.
        directedDoubleSine V U is the ideal-block representative of the paper's
        trial-side sin 2Theta_0; the included development proves equality of the
        complete approximation-number sequence. The declaration does not impose
        the Section 1 matching-relative-dimension equations; that strengthening is
        disclosed in fidelity.divergences. The canonical included source API is
        TauCeti.DavisKahan1970.SectionTwo.sinTwoTheta_directed.
    - source: Davis--Kahan 1970, Section 2, sin 2Theta theorem (whole-space conclusion)
      lean: RotationOfEigenvectors.sinTwoTheta_ambient
      module: Palomar.DKSectionTwo.Solution
      status: adapted
      note: >-
        This declaration uses the printed operator roles: U reduces A, V reduces
        A+H, and SinTwoThetaGap puts Lambda_0 (the V-block) inside the source
        interval and Lambda_1 (the orthogonal block) outside the enlarged interval,
        with the printed lower half-line extension. H is bounded and self-adjoint,
        exactly the clause-local boundedness needed for the ambient inference. Both
        displayed norms are assumed finite, matching
        the source-facing where-defined endpoint. ambientDoubleSine is the
        reflected-projector representative; the included generic theorem proves it
        has the same complete approximation-number sequence as the paper's ambient
        sin 2Theta operator. The canonical perturbed-gap source API is
        TauCeti.DavisKahan1970.SectionTwo.sinTwoTheta_ambient.
    - source: Davis--Kahan 1970, Section 2, tan 2Theta theorem (residual conclusion)
      lean: RotationOfEigenvectors.tanTwoTheta
      module: Palomar.DKSectionTwo.Solution
      status: adapted
      note: >-
        This is the residual/directed conclusion with branch-free tangent
        definedness, at the paper's standing separable ambient-space scope. Its
        one-sided block gap is the half-line form explicitly allowed after the
        Section 2 theorem statements, and the two diagonal-zero hypotheses are the
        source's H_0=0 and H_1=0. The Lean statement does not impose the standing
        Section 1 matching-relative-dimension equations; this is a formal
        strengthening, and Section 8 explicitly says no corresponding unequal-
        dimension extension of the tan-2-Theta theorem was known. The source states
        that the whole-space estimate follows by Lemma 6.1. The corresponding
        included source API is
        TauCeti.DavisKahan1970.SectionTwo.tanTwoTheta_directed.
