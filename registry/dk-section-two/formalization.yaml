# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
#
# Metadata for the Davis-Kahan 1970 extraction.
#
# This repository carries the proof. It is an extraction of the corresponding
# packages from AIQ-Kitware/aiq-dkps-formalization, which remains authoritative;
# see README.md for what that means for updates.
version: v0.4
project:
  name: 'Davis-Kahan 1970: the four Section 2 theorems'
  description: 'Machine-checked proofs of the four unnumbered theorems Davis and Kahan
    open Section 2 with, at the scope the paper states them: a Hilbert space of arbitrary
    dimension over the reals or the complexes, an ambient self-adjoint operator that may be
    unbounded, an arbitrary unitarily invariant norm, and separating intervals that may be
    half-infinite. Seven printed inequality clauses in all -- sin-Theta, and a directed and
    an ambient clause each for tan-Theta, sin-2-Theta and tan-2-Theta -- with the printed
    residual on the right, the printed constants one and two, and the trial subspace assumed
    only to reduce the operator rather than to be selected spectrally. The two tangent
    families additionally conclude, rather than assume, that no principal angle sits at the
    tangent''s pole. Six of the seven clauses state exactly the printed hypotheses; the
    seventh, the ambient tan-Theta clause, additionally carries the paper''s condition
    (3.5), which the Section 2 display does not print and which is imported from the later
    standing scope in which the paper proves that clause. That source-interpretation
    decision is set out in full under `sources` and `fidelity` below.'
  authors:
  - Jon Crall
  - Edward Wang
  license: Apache-2.0
  responsible_maintainers:
  - Jon Crall
# `repository` is omitted deliberately. Current Palomar policy omits it when the
# submitted repository contains the substantive development, and records that
# default as `substantive-development` in the mechanical report; the explicit
# `repository.role` spelling is still accepted but unnecessary. This repository
# physically contains the proof -- ForTauCeti and DavisKahan, copied verbatim and
# built here -- so it is a substantive development, not a thin wrapper.
classification:
  arxiv:
  - math.FA
  - math.NA
  msc2020:
  - 47A55
  - 47A15
  - 15A42
  - 65F15
sources:
- title: The rotation of eigenvectors by a perturbation. III
  authors:
  - Chandler Davis
  - William M. Kahan
  id: doi:10.1137/0707001
  type: paper
  location: SIAM Journal on Numerical Analysis 7(1), 1970, 1-46
  relationship: formalizes
  note: 'The compared theorems are the four unnumbered ones of Section 2, at the printed
    scope and with no weakened conclusion. Three qualifications are disclosed rather than
    left for a reader to discover.

    (1) ONE ADDED HYPOTHESIS, IN ONE CLAUSE. The ambient tan-Theta clause carries
    `CrossedDefectsEquivalent U V`, the constructive form of the paper''s condition (3.5):
    the two crossing subspaces are isometrically isomorphic. This is not written in the
    Section 2 display. (3.5) is introduced in Section 3, assumed standing there for the
    remainder of the paper except where the contrary is stated, and used by the Section 6
    proof of this very clause; the hypothesis is imported from that later standing scope,
    not read off the local statement. It is consumed rather than decorative: both the
    inequality and the no-pole conclusion are proved from it. The reason it is needed is
    that nothing in the printed hypotheses constrains the crossing subspace on the other
    side, and in infinite dimension -- and only there, since (3.5) is automatic when either
    the subspace or its orthocomplement is finite-dimensional -- that subspace can be
    nonzero, making the ambient angle contain a right angle, the ambient tangent unbounded,
    and its displayed norm nonexistent while the perturbation norm is finite. This
    formalization reads the printed theorem under the paper''s own global semantics, in
    which Section 1 announces once that results of this kind are vacuous when a displayed
    norm fails to exist. The competing literal reading -- take only the printed hypotheses
    and value the missing norm as +infinity -- would make the printed ambient clause false
    as transcribed, and is rejected because it would equally convict the Section 1
    angle-doubling sentence and every later development that silently uses the direct
    rotation. This is therefore a disclosed source-interpretation decision, not a claim
    that the Section 2 display literally contains (3.5), and it is deliberately kept
    distinct from the repository''s one genuine refutation (Proposition 4.4). The other six
    clauses state exactly the printed hypotheses. The full four-layer analysis -- what the
    display says, what the later standing scope says, what the source proof uses, and what
    this formalization adopts -- is in the authoritative repository at
    prose/distilled_literature/DavisKahan1970_part_III.tex (editorial audit note on
    nonlocal source semantics of the Section 2 ambient tangent conclusion) and at
    dev/davis-kahan-1970-formalization-result-inventory.json, entry S2-tan-theta, field
    nonlocal_source_interpretation.

    (2) The sin-2-Theta directed clause takes a bounded trial compression, which is
    what the Appendix to Section 6 supports: the Appendix relaxes the sine family to allow
    one of the two exact blocks to be unbounded and reserves "both may be unbounded" for the
    tangent theorem, and names no double-angle result at all.

    (3) A doubled angle is presented by its own sine rather than by doubling the single
    angle, because t -> sin 2t is not monotone on [0, pi/2] and so no indexwise map carries
    the ordered singular values of sin Theta to those of sin 2 Theta.

    One disclosure about the wider formalization, not part of this entry: printed
    Proposition 4.4 is false and carries a machine-checked counterexample together with the
    natural Q-norm repair.'
  author_endorsement: not-contacted
status:
  scope: 'Formalized and compared here: the four Section 2 theorems, seven printed
    inequality clauses, at an arbitrary RCLike scalar field, arbitrary dimension, an
    unbounded self-adjoint ambient operator, an arbitrary unitarily invariant norm, and
    a reducing rather than spectrally selected trial subspace. Not compared here: the rest
    of the 1970 paper -- Sections 3 to 10, the direct-rotation theory, the counterexamples,
    and the sharpness material -- all of which is formalized in the `DavisKahan` library
    included here. The source-order census and the semantic-audit apparatus that track that
    wider coverage stay in the authoritative repository and are deliberately not duplicated
    here; this repository does not make a completion claim about the 1970 paper.
    `Palomar/DKSectionTwo/Challenge.lean` carries the four deliberate statement-side holes
    the Comparator convention requires, and no library declaration in `ForTauCeti` or
    `DavisKahan` is left incomplete.'
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: []
