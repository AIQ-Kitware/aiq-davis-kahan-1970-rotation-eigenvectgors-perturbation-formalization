version: v0.4
project:
  name: 'Davis-Kahan 1970: four Section 2 theorem families'
  description: 'Machine-checked Palomar presentation of the four headline Davis-Kahan Section 2 theorem families at the source''s Hilbert-space scope. The comparator exposes five ordinary theorem declarations: sin-Theta; the stronger residual tan-Theta estimate; the residual and whole-space sin-2-Theta estimates; and the stronger residual tan-2-Theta estimate. The redundant whole-space tangent clauses are not separately compared because the paper derives them after the residual bounds. No artificial Prop-valued result wrappers or long conjunctions are used.'
  authors:
  - Jon Crall
  - Edward Wang
  license: Apache-2.0
  responsible_maintainers:
  - Jon Crall
classification:
  arxiv:
  - math.FA
  - math.NA
  msc2020:
  - 47A55
  - 47A15
  - 15A42
  - 65F15
sources:
- title: The rotation of eigenvectors by a perturbation. III
  authors:
  - Chandler Davis
  - William M. Kahan
  id: doi:10.1137/0707001
  type: paper
  location: SIAM Journal on Numerical Analysis 7(1), 1970, 1-46
  relationship: formalizes
  note: The challenge follows the four unnumbered theorem families in Section 2. For sin-Theta it compares the printed residual estimate delta ||sin Theta_0|| <= ||R||; the paper explicitly notes that the corresponding whole-space UIN estimate does not follow from that one-gap hypothesis and gives a counterexample. For tan-Theta it compares the residual estimate delta ||tan Theta_0|| <= ||R||, after which the source proof derives the whole-space estimate from the two-corner geometry. For sin-2-Theta both residual and whole-space estimates are compared because the source proof obtains them as distinct public consequences of a stronger reflection argument. For tan-2-Theta it compares the residual estimate delta ||tan 2Theta_0|| <= 2||R||; the source explicitly states that the whole-space estimate follows by Lemma 6.1. The doubled-angle sine is represented directly rather than by indexwise doubling of ordered principal angles.
  author_endorsement: not-contacted
status:
  scope: 'Compared here: five polished declarations representing the four Section 2 theorem families -- sinTheta, tanTheta (residual form), sinTwoTheta_directed, sinTwoTheta_ambient, and tanTwoTheta (residual form) -- over arbitrary RCLike scalar fields and arbitrary Hilbert dimension, with the source constants and right-hand sides. The rest of the 1970 paper remains in the included DavisKahan library but is outside this comparator entry.'
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: []
automation:
  methods:
  - method: agent
    models:
    - claude-opus-5
    - claude-opus-4-8
    - claude-fable-5
    - gpt-5.6-terra
    - gpt-5.6-sol
    framework: Claude Code
    tool_setup: Agents worked directly in the authoritative repository with the Lean toolchain, running `lake build` and that repository's gate suite; the libraries here are the extraction of the result. Model attribution is recorded per declaration in the module provenance headers carried into this repository, and per commit in Co-Authored-By trailers and in the measured token ledger, both of which stay in the authoritative repository along with the gate suite.
    cost:
      wall_time: not tracked as elapsed time; the ledger records 44657 assistant turns across 1591 accounted commits
      spend_usd: subscription-based; not tracked per commit
      hardware: API-only
    prompting_notes: 'Work was directed by task, not by prompt template: a scope decision from the maintainer, then autonomous proof and audit work against the source censuses. Adversarial review prompts are checked in under `dev/` and are part of the audit record.'
  - method: manual
    framework: n/a
    tool_setup: The human maintainer set scope and priorities, ran builds and audits, inspected theorem interfaces, coordinated subject-matter discussion with the applied-paper authors, adjudicated source-fidelity questions, accepted or rejected proposed repairs, and decided repository policy.
  spend_usd: subscription-based; not tracked
  notes: This is a heavily agent-authored formalization with human direction and review. The Lean kernel is the proof checker, and it checks the libraries here exactly as it checks them upstream. The mechanical gates that additionally audit dependency layering, axiom closure, census consistency and comparator statement equality run in the authoritative repository and are deliberately not duplicated here. Those checks do not establish that a Lean statement says what a paper says, which is why every source paper carries a separate clause-by-clause semantic review, also maintained there.
fidelity:
  divergences: 'No conclusion is weakened. The comparator intentionally omits the separately displayed whole-space tan-Theta and tan-2-Theta clauses because the source proofs derive those from the stronger residual estimates plus the theorem context; this is a presentation choice, not a mathematical weakening. Both sin-2-Theta clauses remain separate because neither printed clause is merely the other with a larger right-hand side. The sin-Theta entry is residual-only, matching the source theorem: Davis and Kahan explicitly give a counterexample to the ambient UIN estimate under only the one-gap sin-Theta hypotheses.'
review:
  status: self-assessed
  reviewers:
  - Jon Crall
  notes: The comparator surface was audited against the modernized transcription of the original 1970 paper and against the compiling parent formalization. The public entry uses five ordinary theorem declarations rather than Prop-valued packaging structures. Kernel verification is provided by building the Challenge and Solution modules; source-semantic review remains distinct from compiler verification.
