version: v0.4

project:
  name: 'Davis-Kahan 1970: the four Section 2 rotation-of-eigenvectors theorem families'
  description: >-
    Machine-checked Lean 4 presentation of the four headline theorem families in
    Section 2 of Davis and Kahan (1970): sin-Theta, tan-Theta, sin-2-Theta, and
    tan-2-Theta. The Palomar Comparator exposes five selected source-facing
    declarations: the residual sin-Theta estimate, the residual tan-Theta estimate,
    both the residual and whole-space sin-2-Theta estimates, and the residual
    tan-2-Theta estimate. The statements retain the paper's standing separable
    ambient Hilbert-space scope, permit finite or infinite ambient dimension, and
    are generic over RCLike scalars to cover the real and complex cases. Their norm
    quantifier is presented in the
    Challenge by a dimension-coherent symmetric norming function; the included
    formalization proves via Fan dominance that the corresponding inequalities
    yield the source-facing universal unitarily invariant norm estimates.
  authors:
    - Jon Crall
    - Edward Wang
  license: Apache-2.0
  responsible_maintainers:
    - Jon Crall

classification:
  arxiv:
    - math.FA
    - math.NA
  msc2020:
    - 47A55
    - 47A15
    - 15A42
    - 65F15

sources:
  - title: The rotation of eigenvectors by a perturbation. III
    authors:
      - Chandler Davis
      - William M. Kahan
    id: doi:10.1137/0707001
    type: paper
    location: >-
      Section 1 standing notation, separability, and subspace-dimension setup;
      Section 2 four unnumbered theorem statements and the unbounded-operator
      paragraph immediately following them; Appendix to Section 6 for the
      common-domain bounded-residual extension; Section 7 for the double-angle
      proofs; Section 8 for the explicit unequal-dimension sin-2-Theta extension
      and the statement that no corresponding tan-2-Theta extension was known
    relationship: formalizes
    note: >-
      The compared declarations select five source-facing clauses from the four
      unnumbered theorem families in Section 2. For sin-Theta the Challenge compares
      the printed residual estimate and uses the source-facing where-defined norm
      boundary; the paper explicitly shows that the analogous whole-space UIN
      estimate does not follow from the one-gap hypotheses. For tan-Theta the
      residual estimate is compared; the source proof then derives the whole-space
      estimate from the common two-corner geometry. Both sin-2-Theta clauses are
      compared because they are distinct conclusions. Their public gap predicate is
      deliberately oriented as printed: Lambda_0 is inside [beta, alpha] and
      Lambda_1 is outside (beta-delta, alpha+delta), with the lower half-line
      extension Lambda_0 <= alpha and Lambda_1 >= alpha+delta that the paragraph
      after the four statements explicitly authorizes. In the directed clause, A
      and the perturbed operator T are self-adjoint on a common domain, U reduces A,
      V reduces T, and only the residual extension is required bounded; Appendix 6
      supplies the common-domain/bounded-extension mechanism and Section 7 supplies
      the double-angle proof. In the ambient clause T is A+H for a bounded
      self-adjoint H and the same oriented perturbed-block gap is used. For
      tan-2-Theta the residual estimate is compared; the source states that the
      whole-space estimate follows by Lemma 6.1. The Challenge uses a
      symmetric-norming presentation of the norm quantifier. This is not literally
      the entire infinite-dimensional UIN type, but the included development proves
      the relevant quantifier equivalence for these inequalities through Ky Fan/Fan
      dominance and provides source-facing where-defined endpoints.
    author_endorsement: not-contacted

related_formalizations:
  - id: AIQ-Kitware/aiq-dkps-formalization
    relationship: builds-on
    note: >-
      Authoritative development and audit history. The accepted common-domain
      sin-2-Theta source module and the source-facing Section Two inventory used by
      this submission were refreshed from parent commit
      9fe59f6b02482111e5be6a2b812edd011990fda5. The standalone repository commits
      the extracted proof source it builds; it is not a thin Comparator-only
      wrapper.

status:
  scope: >-
    Compared here are five declarations: sinTheta; tanTheta in the stronger
    residual form; sinTwoTheta_directed at the source common-domain scope;
    sinTwoTheta_ambient; and tanTwoTheta in the stronger residual form. The
    Challenge is Mathlib-only and defines the source vocabulary it needs locally.
    The statements are generic over RCLike, retain the paper's standing
    separability convention, and use unbounded partial maps where the source scope
    requires them. Their subspace/angle formulation does not impose the matching
    relative-dimension equations from the paper's standing Section 1 direct-rotation
    setup; that deliberate strengthening is disclosed under fidelity.divergences.
    The three sine declarations expose the source-facing
    where-defined norm boundary rather than adding ideal-membership transfer to the
    public conclusion. The directed sin-2-Theta declaration does not assume a
    bounded trial compression or a globally bounded perturbation: it assumes only
    a common domain and a bounded residual extension. Whole-space tan-Theta and
    tan-2-Theta endpoints, broader source-facing UIN facades, and the rest of the
    1970 paper are proved in the included DavisKahan library but are not separate
    Comparator declarations in this entry. The entry makes no claim that every
    result of the 1970 paper is selected by Comparator.
  sorry_count: 0
  sorry_in_definitions: 0
  main_results:
    - declaration: RotationOfEigenvectors.sinTheta
      file: Palomar/DKSectionTwo/Solution.lean
      sorry_count: 0
      comparator_config: registry/dk-section-two/comparator.json
    - declaration: RotationOfEigenvectors.tanTheta
      file: Palomar/DKSectionTwo/Solution.lean
      sorry_count: 0
      comparator_config: registry/dk-section-two/comparator.json
    - declaration: RotationOfEigenvectors.sinTwoTheta_directed
      file: Palomar/DKSectionTwo/Solution.lean
      sorry_count: 0
      comparator_config: registry/dk-section-two/comparator.json
    - declaration: RotationOfEigenvectors.sinTwoTheta_ambient
      file: Palomar/DKSectionTwo/Solution.lean
      sorry_count: 0
      comparator_config: registry/dk-section-two/comparator.json
    - declaration: RotationOfEigenvectors.tanTwoTheta
      file: Palomar/DKSectionTwo/Solution.lean
      sorry_count: 0
      comparator_config: registry/dk-section-two/comparator.json

