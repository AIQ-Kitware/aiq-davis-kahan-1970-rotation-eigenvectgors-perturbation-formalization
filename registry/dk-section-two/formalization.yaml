  notes: This is a heavily agent-authored formalization with human direction and review. The
    Lean kernel is the proof checker, and it checks the libraries here exactly as it checks
    them upstream. The mechanical gates that additionally audit dependency layering, axiom
    closure, census consistency and comparator statement equality run in the authoritative
    repository and are deliberately not duplicated here. Those checks do not establish that a
    Lean statement says what a paper says, which is why every source paper carries a separate
    clause-by-clause semantic review, also maintained there.
fidelity:
  divergences: 'One, in one of the seven compared clauses, and it is a scope qualification
    rather than a weakened conclusion.

    AMBIENT tan-Theta CARRIES THE PAPER''S CONDITION (3.5), WHICH THE SECTION 2 DISPLAY DOES
    NOT PRINT. The Lean clause takes `CrossedDefectsEquivalent U V`; the printed Section 2
    statement of the tan-Theta theorem lists only the ordered spectral gap and H_0 = 0, and
    (3.5) has not been introduced at that point in the paper. The hypothesis is imported
    from Section 3, where (3.5) is made standing for the remainder of the paper, and where
    the Section 6 proof of this clause works. This formalization''s position is that the
    printed theorem is true under the paper''s own global semantics -- Section 1 declares
    results vacuous when a displayed norm fails to exist -- and that the (3.5)-qualified
    Lean statement is the faithful rendering of those semantics. Under the competing
    literal reading, in which only the printed hypotheses are taken and a missing norm is
    valued at +infinity, the printed clause is false in infinite dimension and the Lean
    statement is its repair. Either way, a reader must be told that the Lean hypothesis is
    not in the printed display, and this entry does not claim otherwise. See the source
    note above for the argument, and the authoritative repository for the four-layer
    analysis and the explicit counter-configuration.

    The other six clauses state exactly the printed hypotheses at the stated scope, with the
    printed right-hand sides and constants. The two remaining qualifications recorded in the
    source note -- the bounded trial compression in the sin-2-Theta directed clause, and the
    presentation of a doubled angle by its own sine -- are scope and representation
    decisions with source justification, not divergences from a printed hypothesis.

    Divergences elsewhere in the source paper, including the refutation of printed
    Proposition 4.4, are recorded in the substantive repository and summarized in the source
    note above.'
review:
  status: self-assessed
  reviewers:
  - Jon Crall
  notes: 'No external peer review. What has happened, and should be read as exactly that:
    kernel verification of every claimed declaration by `lake build`; repository gates auditing
    dependency layers, axiom closure, docstring coverage, comparator statement equality and
    census consistency; repeated adversarial source audits in which an independent agent was
    asked to find a discrepancy between a printed statement and its Lean rendering, several
    of which found real defects that are recorded in the censuses; and human coordinator review
    of scope, theorem interfaces and repair decisions. Those adversarial audits are what
    produced the ambient tan-Theta disclosure recorded under `fidelity.divergences`: the
    (3.5) hypothesis is a deliberate source-interpretation decision, taken and defended in
    the open, and a reviewer who disagrees with it should challenge it at
    dev/davis-kahan-1970-formalization-result-inventory.json, entry S2-tan-theta, field
    nonlocal_source_interpretation, which is written to ask for an explicit verdict.

    For Davis–Kahan 1970 the authoritative repository generates a self-contained
    compiler-evidence bundle and source-order audit packet. That certificate proves elaboration
    and declaration resolution. It does not prove source equivalence, and the completion
    standard is deliberately three independent axes: source-facing implementation, compiler
    verification, and hostile semantic acceptance. The census and audit apparatus that carries
    those axes is not extracted here; this repository makes no completion claim about the
    1970 paper.'
